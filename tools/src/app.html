<title>90 Day Run</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky bar met voortgang, één smalle leeskolom; de dagenring (90 streepjes) is het terugkerende beeld. */
:root{
  --bg:#0f0b0b; --surface:#191212; --field:#120d0d; --line:#3b2a2a; --fg:#f4ece9; --muted:#ab9b93;
  --accent:#e5342d; --accent-ink:#fff; --ok:#5fbf8a; --soft:#2a1816;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#faf5f2; --surface:#ffffff; --field:#fffdfc; --line:#ddcfc9; --fg:#1d1414; --muted:#6d5e58;
  --accent:#c9211b; --accent-ink:#fff; --ok:#1f8a53; --soft:#f6e6e2; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#faf5f2; --surface:#ffffff; --field:#fffdfc; --line:#ddcfc9; --fg:#1d1414; --muted:#6d5e58;
  --accent:#c9211b; --accent-ink:#fff; --ok:#1f8a53; --soft:#f6e6e2; color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:400 16px/1.6 var(--body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
a{color:inherit}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;line-height:.95;margin:0;text-wrap:balance;font-weight:800;letter-spacing:.01em}
h1{font-size:clamp(2.2rem,8vw,4rem);font-weight:900;overflow-wrap:anywhere}
h2{font-size:clamp(1.7rem,5vw,2.3rem)}
h3{font-size:1.45rem}
p{margin:0 0 .8em;max-width:65ch}
.muted{color:var(--muted)}
.mono{font:500 .72rem/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:860px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* kop */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin:0 -2px;padding:10px 2px 0}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:900;font-size:1.6rem;text-transform:uppercase;letter-spacing:.02em;text-decoration:none;line-height:1}
.brand b{color:var(--accent)}
.hp{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
.hp .track{width:90px}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.nav{display:flex;gap:2px;overflow-x:auto;margin-top:6px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{white-space:nowrap;text-decoration:none;padding:9px 12px;font-weight:600;font-size:.9rem;color:var(--muted);border-bottom:2px solid transparent}
.nav a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.warn{background:var(--soft);border:1px solid var(--accent);padding:8px 12px;margin:12px 0;font-size:.9rem}

main{padding-top:28px;display:grid;gap:40px}
.sec{display:grid;gap:14px}
.sechead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font:500 .7rem/1.5 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pill.on{border-color:var(--accent);color:var(--accent)}

/* knoppen */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:4px;font-weight:700;text-decoration:none;font-size:.95rem}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:28px;align-items:center}
@media(max-width:620px){.hero{grid-template-columns:1fr;justify-items:start}}
.hero>*{min-width:0}
.ringsvg{width:100%;max-width:230px;height:auto}
.tk{stroke:var(--line);stroke-width:3;stroke-linecap:round}
.tk.past{stroke:var(--muted)} .tk.done{stroke:var(--accent)} .tk.now{stroke:var(--fg);stroke-width:5}
.ringnum{font-family:var(--display);font-weight:900;font-size:78px;fill:var(--fg)}
.ringlab{font:500 11px var(--mono);letter-spacing:.12em;fill:var(--muted)}
.today{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.today[aria-pressed="true"]{border-color:var(--ok)}
.box{flex:none;width:28px;height:28px;border:2px solid var(--muted);border-radius:4px;display:grid;place-items:center;font-weight:900;color:transparent}
[aria-pressed="true"]>.box,input:checked+.box{background:var(--ok);border-color:var(--ok);color:#0b0b0b}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stats div{display:grid}
.stats b{font:800 1.9rem/1 var(--display)}

/* reis */
.phase{display:grid;gap:8px}
.wk{display:grid;grid-template-columns:2.6rem minmax(0,1fr) auto;gap:12px;align-items:center;text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--surface)}
.wk:hover{border-color:var(--accent)}
.wk .n{font:900 1.9rem/1 var(--display);color:var(--accent)}
.wk .t{font-weight:700;line-height:1.25}
.wk .track{width:84px}
.wk.rest .n{color:var(--muted)}
.evmark{justify-self:start;margin:2px 0 0 14px}

/* week */
.wkhead{display:grid;gap:12px}
.list{margin:0;padding-left:1.1em;display:grid;gap:6px;max-width:65ch}
.list li::marker{color:var(--accent)}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.fiche{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;display:grid;gap:14px}
.steps{margin:0;padding-left:1.3em;display:grid;gap:4px;max-width:65ch}
details>summary{cursor:pointer;font-weight:700;padding:6px 0}
.f{display:grid;gap:6px}
.lb{font-weight:600;font-size:.92rem}
textarea,input[type=text],input[type=number],input[type=date],select{width:100%;background:var(--field);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:9px 10px;font:inherit;min-width:0}
textarea{resize:vertical;field-sizing:content;min-height:2.6em}
textarea::placeholder,input::placeholder{color:var(--muted)}
.scalerow{display:grid;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:grid;place-items:center;min-width:42px;height:42px;padding:0 10px;border:1px solid var(--line);border-radius:4px;font-weight:700;background:var(--field)}
.opt input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.opt.wide span{padding:0 14px;min-width:0}
.tbl{display:grid;gap:8px}
.tr{display:grid;grid-template-columns:var(--cols);gap:8px;align-items:start}
.tr.th{font:500 .68rem/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);align-items:end}
.cell{min-width:0}
.cell::before{display:none}
.rn{font:800 1.2rem/38px var(--display);color:var(--accent);text-align:center}
.rl{font-weight:700;padding-top:8px}
.cell.c{display:flex;align-items:center;min-height:38px}
.chk{position:relative;display:inline-flex}
.chk input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chk input:focus-visible+.box{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:640px){
  .tr.th{display:none}
  .tr{grid-template-columns:1fr;border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--bg)}
  .cell::before{display:block;content:attr(data-l);font:500 .68rem/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .rn{text-align:left;line-height:1}.rn::before{display:none}
  .cell.c{flex-wrap:wrap;gap:8px}
}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{display:grid;justify-items:center;gap:2px;padding:10px 0;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-weight:700}
.day small{font:500 .65rem var(--mono);color:var(--muted)}
.day[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#0b0b0b}
.day[aria-pressed="true"] small{color:#0b0b0b}
.day.now{border-color:var(--fg)}
.counters{display:grid;gap:8px}
.cr{display:grid;grid-template-columns:minmax(0,1fr) 84px 84px;gap:10px;align-items:center}
.cr.h{font:500 .68rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}
.q{border-left:3px solid var(--accent);padding-left:12px;font-weight:600}
.chartwrap{overflow-x:auto}
.chart{width:100%;min-width:480px;height:auto}
.bar1{fill:var(--accent)} .barbg{fill:var(--soft)}
.axis{stroke:var(--line);stroke-width:1} .ct{font:500 11px var(--mono);fill:var(--muted)}
.big{font:900 2.6rem/1 var(--display)}
.sums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.sums div{border-top:2px solid var(--accent);padding-top:8px;display:grid}
.mat{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:8px}
.mat a{display:flex;justify-content:space-between;gap:10px;text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--surface);font-weight:600}
.mat a:hover{border-color:var(--accent)}
.mat a::after{content:"↗";color:var(--accent)}
.rules{display:grid;gap:10px;counter-reset:r}
.rules>div{border-top:1px solid var(--line);padding-top:10px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.track i{transition:none}}
</style>

  </header>

  <main id="app"></main>
</div>

/* ---- state ---- */
const KEY='run90.v1';
let S={v:1,d:{}}, saveT=0;
try{const r=localStorage.getItem(KEY); if(r){const o=JSON.parse(r); if(o&&o.d) S=o}}catch(e){}
const get=k=>S.d[k];
function put(k,v){ if(v===''||v===false||v==null) delete S.d[k]; else S.d[k]=v; clearTimeout(saveT); saveT=setTimeout(persist,350) }
function persist(){ try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){document.getElementById('warn').hidden=false} }
const h=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sid=k=>'f_'+k.replace(/[^\w]/g,'_');
const sentence=s=>s?s[0]+s.slice(1).toLowerCase():'';

/* ---- datum ---- */
const day0=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const fmt=d=>d.getDate()+' '+MON[d.getMonth()];
/* Dag 1 is de dag waarop de deelnemer zelf start (me|start, door de server gezet). */
const startD=()=>{const m=String(get('me|start')||'').match(/^(\d{4})-(\d\d)-(\d\d)$/);return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const started=()=>{const i=todayIdx();return i!=null&&i>=0};
const todayIdx=()=>{const s=startD();return s?Math.round((day0(new Date())-s)/864e5):null};
const dayDate=(n,i)=>{const s=startD();return s?addDays(s,(n-1)*7+i):null};
const weekRange=n=>{const s=startD();return s?fmt(addDays(s,(n-1)*7))+' – '+fmt(addDays(s,(n-1)*7+6)):''};
function current(){const i=todayIdx(); if(i==null) return {i:-1,w:1,d:0,state:'new'}; if(i<0) return {i,w:1,d:0,state:'before'}; if(i>90) return {i,w:13,d:6,state:'after'}; return {i,w:Math.min(13,Math.floor(i/7)+1),d:Math.min(6,i%7),state:'run'}}

/* ---- toegang: een week gaat open als de vorige gelezen en de training gevolgd is ---- */
const prevWeek=n=>n===9?7:n-1;
const nextWeek=n=>n===7?8:n<13?n+1:0;
const ready=n=>!!(get(`w${n}|read`)&&get(`w${n}|trained`));
function isOpen(n){
  if(VIEW) return true;
  if(!started()) return false;
  if(ACCESS.unlock_to!=null&&n<=ACCESS.unlock_to) return true;
  return n===1||ready(prevWeek(n));
}
function frontier(){for(const n of HABIT) if(isOpen(n)&&!ready(n)) return n; return 0}

/* ---- metrics ---- */
const wd=n=>{let c=0;for(let i=0;i<7;i++) if(get(`w${n}|d${i}`)) c++;return c};
const totalDays=()=>HABIT.reduce((a,n)=>a+wd(n),0);
const weeksDone=()=>WEEKS.filter(w=>get(`w${w.n}|done`)).length;
const sumRow=(r,f)=>HABIT.reduce((a,n)=>a+(Number(get(`w${n}|t.${r}.${f}`))||0),0);
function streak(){const c=current(); if(c.i<0) return 0; const top=Math.min(c.i,90); let s=0;
  for(let k=top;k>=0;k--){const w=Math.floor(k/7)+1; if(w===8) continue; if(get(`w${w}|d${k%7}`)) s++; else if(k===top&&c.state==='run') continue; else break}
  return s}
const pct=()=>Math.round(totalDays()/84*100);

/* ---- velden ---- */
function text(key,label,rows){const id=sid(key);return `<div class="f"><label class="lb" for="${id}">${h(label)}</label><textarea id="${id}" data-k="${key}" rows="${rows||3}">${h(get(key)||'')}</textarea></div>`}
function cellInput(key,c,label){const id=sid(key),v=get(key);
  if(c.ty==='check') return `<label class="chk"><input type="checkbox" id="${id}" data-k="${key}" ${v?'checked':''} aria-label="${h(label)}"><span class="box">✓</span></label>`;
  if(c.ty==='num') return `<input type="number" inputmode="numeric" min="0" max="10" id="${id}" data-k="${key}" value="${h(v||'')}" aria-label="${h(label)}">`;
  if(c.ty==='date') return `<input type="date" id="${id}" data-k="${key}" value="${h(v||'')}" aria-label="${h(label)}">`;
  if(c.ty==='select') return `<select id="${id}" data-k="${key}" aria-label="${h(label)}"><option value="">Kies…</option>${c.o.map(o=>`<option ${v===o?'selected':''}>${h(o)}</option>`).join('')}</select>`;
  return `<textarea id="${id}" data-k="${key}" rows="1" aria-label="${h(label)}">${h(v||'')}</textarea>`}
function table(base,b){
  const grid=['2.4rem'].concat(b.cols.map(c=>c.ty==='check'?'5.5rem':c.ty==='num'?'5.2rem':c.ty==='select'?'minmax(0,9.5rem)':c.ty==='date'?'minmax(0,9rem)':'minmax(0,1fr)'));
  if(b.rows) grid[0]='minmax(0,8rem)';
  let o=`<div class="tbl" style="--cols:${grid.join(' ')}"><div class="tr th"><span>${b.rows?'':'#'}</span>${b.cols.map(c=>`<span>${h(c.h)}</span>`).join('')}</div>`;
  for(let r=0;r<b.n;r++){
    o+=`<div class="tr">${b.rows?`<span class="rl">${h(b.rows[r])}</span>`:`<span class="rn">${r+1}</span>`}`;
    b.cols.forEach((c,ci)=>{const key=`${base}.${r}.${ci}`;o+=`<div class="cell ${c.ty==='check'?'c':''}" data-l="${h(c.h)}">${cellInput(key,c,c.h+' '+(r+1))}</div>`});
    o+='</div>'}
  return o+'</div>'}
function block(sc,fid,b){
  const base=`${sc}|${fid}.${b.k}`;
  if(b.t==='text') return text(base,b.l,b.r);
  if(b.t==='num'){const id=sid(base);return `<div class="f"><label class="lb" for="${id}">${h(b.l)}</label><input type="number" inputmode="numeric" min="0" max="${b.max}" id="${id}" data-k="${base}" value="${h(get(base)||'')}" style="max-width:8rem"></div>`}
  if(b.t==='pick') return `<div class="f" role="radiogroup" aria-label="${h(b.l)}"><span class="lb">${h(b.l)}</span><div class="scale">${b.o.map(o=>`<label class="opt wide"><input type="radio" name="${sid(base)}" data-k="${base}" value="${h(o)}" ${get(base)===o?'checked':''}><span>${h(o)}</span></label>`).join('')}</div></div>`;
  if(b.t==='scale') return b.items.map((it,i)=>{const k=`${base}.${i}`;return `<div class="scalerow" role="radiogroup" aria-label="${h(it)}"><span>${h(it)}</span><div class="scale">${Array.from({length:b.max},(_,j)=>`<label class="opt"><input type="radio" name="${sid(k)}" data-k="${k}" value="${j+1}" ${String(get(k))===String(j+1)?'checked':''}><span>${j+1}</span></label>`).join('')}</div></div>`}).join('');
  if(b.t==='table') return table(base,b);
  return ''}
function fiche(sc,f){return `<section class="fiche" id="fiche-${f.id.replace('.','-')}"><div><div class="mono">Fiche ${f.id} · ${h(f.kind)}</div><h3>${h(f.title)}</h3></div>${f.intro?`<p class="muted" style="margin:0">${h(f.intro)}</p>`:''}${f.steps?`<ol class="steps">${f.steps.map(s=>`<li>${h(s)}</li>`).join('')}</ol>`:''}${f.b.map(b=>block(sc,f.id,b)).join('')}</section>`}

/* ---- weergaven ---- */
function ring(){
  const c=current(), n=c.state==='run'?Math.min(90,c.i+1):c.state==='after'?90:0;
  let t='';
  for(let i=0;i<90;i++){
    const a=(-90+i*4)*Math.PI/180, x1=110+84*Math.cos(a), y1=110+84*Math.sin(a), x2=110+104*Math.cos(a), y2=110+104*Math.sin(a);
    const w=Math.floor(i/7)+1, on=get(`w${w}|d${i%7}`);
    const cls=c.state==='run'&&i===c.i?'now':on?'done':i<n?'past':'';
    t+=`<line class="tk ${cls}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`}
  return `<svg class="ringsvg" viewBox="0 0 220 220" role="img" aria-label="Negentig dagen, ${n} voorbij">${t}<text class="ringlab" x="110" y="84" text-anchor="middle">DAG</text><text class="ringnum" x="110" y="144" text-anchor="middle">${n||'–'}</text><text class="ringlab" x="110" y="166" text-anchor="middle">VAN 90</text></svg>`}

const LOCK='<svg class="lockic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const checkRow=(k,label)=>`<span class="ck ${get(k)?'on':''}"><i>${get(k)?'✓':''}</i>${label}</span>`;
function gateCard(n){
  const nx=nextWeek(n);
  return `<div class="card gate"><div class="mono">Volgende stap · week ${n}</div><div class="cks">${checkRow(`w${n}|read`,'Hoofdstuk gelezen')}${checkRow(`w${n}|trained`,'Live training gevolgd')}</div><p class="muted" style="margin:0">Vink je beide af${nx?`, dan gaat ${nx===8?'de inhaalweek':'week '+nx} open`:''}.</p><div><a class="btn" href="#week-${n}">Naar week ${n}</a></div></div>`}
function liveCard(){
  const s=nextSession(); if(!s) return '';
  return `<div class="card livecard"><div class="mono">Volgende live training</div><b style="font-size:1.1rem">${h(s.title)}</b><span class="muted">${fmtWhen(s.starts_at)}</span><div class="row">${s.join_url?`<a class="btn" href="${h(s.join_url)}" target="_blank" rel="noopener">Doe mee</a>`:''}<a class="btn ghost" href="#live">Alle trainingen</a></div></div>`}
function startForm(){
  const iso=get('me|start')||'';
  return `<form id="startform" class="card" novalidate><div class="mono">Startdatum</div><div class="row"><input id="st-date" type="date" value="${h(iso)}" aria-label="Startdatum" style="width:auto"><button class="btn ghost sm" type="submit">${iso?'Datum wijzigen':'Op deze datum starten'}</button></div><p class="err" id="sterr" role="alert"></p></form>`}
function vWelcome(){
  const c=current(), before=c.state==='before', dd=-c.i;
  return `<div class="sec" style="gap:28px"><div class="hero">${ring()}<div class="sec"><div class="kick">Sales Foundations 90</div><h1>${before?'Nog '+dd+(dd===1?' dag':' dagen'):'Klaar om te starten?'}</h1>
  <p style="font-size:1.1rem;margin:0">${before?'Je start op '+fmt(startD())+'. Tot dan blijven de weken dicht.':'Dag 1 begint op het moment dat jij op start drukt. Je leest week 1, volgt de live training en daarna gaat week 2 open. Zo bepaal jij je eigen tempo.'}</p>
  <div class="row"><button class="btn big-btn" type="button" data-start="1">${before?'Toch vandaag starten':'Start mijn 90 dagen'}</button><a class="btn ghost" href="#mijn-90">Mijn doel opschrijven</a></div></div></div>${startForm()}${liveCard()}</div>`}
function vStart(){
  const c=current();
  if((c.state==='new'||c.state==='before')&&!VIEW) return vWelcome();
  const fw=frontier(), w=WEEKS[(fw||c.w)-1], name=get('me|naam');
  let head, action='';
  if(c.state==='new') head=`<div class="kick">Nog niet gestart</div><h1>Run nog niet begonnen</h1>`;
  else if(c.state==='after'){head=`<div class="kick">Dag 90</div><h1>Dit heb jij gebouwd</h1>`}
  else head=`<div class="kick">${WD[addDays(startD(),c.i).getDay()]} ${fmt(addDays(startD(),c.i))} · dag ${c.i+1} van 90</div><h1>${h(w.title)}</h1><p class="muted" style="margin:0">Week ${w.n} · ${h(w.ph)}</p>`;
  if(c.state==='run'){
    const cw=WEEKS[c.w-1];
    if(c.w===8) action=`<a class="today" href="#week-8" style="text-decoration:none"><span class="box" style="border-color:var(--accent)"></span><span><b>Inhaalweek.</b><br><span class="muted">Haal in wat bleef liggen, of laad op voor de tweede helft.</span></span></a>`;
    else if(!isOpen(c.w)) action=`<a class="today lockedtoday" href="#week-${c.w}" style="text-decoration:none">${LOCK}<span><b>Week ${c.w} is nog dicht.</b><br><span class="muted">Rond eerst week ${prevWeek(c.w)} af: lezen en de training volgen.</span></span></a>`;
    else{const k=`w${c.w}|d${c.d}`; action=`<button class="today" id="todaybtn" data-day="${k}" aria-pressed="${get(k)?'true':'false'}"><span class="box">✓</span><span><b id="todaylab">${get(k)?'Vandaag gedaan':'Vandaag afvinken'}</b><br><span class="muted">${h(cw.gew)}</span></span></button>`}}
  const first=!get('me|doel')?`<div class="card"><div class="mono">Eerste stap</div><p style="margin:6px 0 12px"><b>Schrijf je doel voor dag 90 op.</b> Het is het enige dat je nodig hebt om te starten.</p><a class="btn" href="#mijn-90">Mijn 90 dagen invullen</a></div>`:`<div class="card"><div class="mono">Mijn doel${name?' · '+h(name):''}</div><p style="margin:6px 0 0;font-size:1.1rem">${h(get('me|doel'))}</p></div>`;
  return `<div class="sec"><div class="hero">${ring()}<div class="sec">${head}${action}<div class="row"><a class="btn ghost" href="#week-${fw||c.w}">Open week ${fw||c.w}</a><a class="btn ghost" href="#reis">Hele reis</a></div></div></div>
  ${fw?gateCard(fw):''}${liveCard()}${first}
  <div class="stats" id="stats"></div>${VIEW?'':startForm()}</div>`}
function statsHtml(){return `<div><span class="mono">Gewoonte-dagen</span><b>${totalDays()}<span class="muted" style="font-size:1rem"> / 84</span></b></div><div><span class="mono">Reeks</span><b>${streak()}</b></div><div><span class="mono">Weken afgerond</span><b>${weeksDone()}<span class="muted" style="font-size:1rem"> / 13</span></b></div>`}

function vReis(){
  const phases=[['Fundament','Jezelf: je houding, je rust en je respect voor de keuze van de ander.',[1,2,3,4]],['Zichtbaarheid','Gesprekken starten en echt begrijpen.',[5,6,7,8,9]],['Uitnodigen','Durven vragen, twijfel onderzoeken en opvolgen tot de lus gesloten is.',[10,11,12,13]]];
  const banner=!started()&&!VIEW?`<div class="card gate"><div class="mono">Nog niet gestart</div><p style="margin:0">Dag 1 begint zodra jij start. Tot dan zijn de weken dicht.</p><div><button class="btn" type="button" data-start="1">Start mijn 90 dagen</button></div></div>`:'';
  return `<div class="sec"><div><div class="kick">13 weken · één route</div><h1>De reis</h1></div>${banner}`+phases.map(([p,d,ws])=>`<section class="phase"><div class="sechead"><h2>${p}</h2><span class="muted">${d}</span></div>${ws.map(n=>{const w=WEEKS[n-1],c=wd(n),r=n===8,open=isOpen(n);
    const sub=open?(weekRange(n)||'Week '+n)+(get(`w${n}|done`)?' · afgerond':''):'Dicht · rond week '+prevWeek(n)+' af';
    const right=r?`<span class="pill">Inhaal</span>`:open?`<span class="track" title="${c} van 7 dagen"><i style="width:${c/7*100}%"></i></span>`:LOCK;
    return `<a class="wk ${r?'rest':''} ${open?'':'locked'}" href="#week-${n}"><span class="n">${String(n).padStart(2,'0')}</span><span><span class="t">${h(w.title)}</span><br><span class="mono">${sub}</span></span>${right}</a>${EVALS[n]&&open?`<a class="pill evmark ${get('ev'+EVALS[n].d+'|score')?'on':''}" href="#week-${n}-evaluatie" data-ev="1">Dag ${EVALS[n].d} · evaluatie</a>`:''}`}).join('')}</section>`).join('')+
  `<section class="phase"><div class="sechead"><h2>Bonus</h2><span class="muted">Wanneer nodig</span></div><a class="wk" href="#bonus"><span class="n">+</span><span><span class="t">Het brand partner-gesprek</span><br><span class="mono">Business</span></span><span></span></a></section></div>`}

function trackerHtml(n,w){
  const c=current(), ti=(c.state==='run'&&c.w===n)?c.d:-1;
  const rows=[['gesprekken','Echte gesprekken gestart'],['opvolgingen','Opvolgingen'],['posts','Stories of posts met een vraag'],['sessie','Sessie of check-in bijgewoond']];
  return `<div class="sec"><div class="days" role="group" aria-label="Dagen van week ${n}">${DOW.map((d0,i)=>{const dd=dayDate(n,i),d=dd?WD[dd.getDay()]:'d'+(i+1);const k=`w${n}|d${i}`;return `<button class="day ${i===ti?'now':''}" data-day="${k}" aria-pressed="${get(k)?'true':'false'}" aria-label="${d}${dayDate(n,i)?' '+fmt(dayDate(n,i)):''}"><span>${d.toUpperCase()}</span><small>${dayDate(n,i)?dayDate(n,i).getDate():'·'}</small></button>`}).join('')}</div>
  <div class="counters"><div class="cr h"><span>Wat ik tel</span><span>Doel</span><span>Gedaan</span></div>${rows.map(([r,l])=>`<div class="cr"><span>${l}</span><input type="number" min="0" inputmode="numeric" data-k="w${n}|t.${r}.doel" id="${sid(`w${n}|t.${r}.doel`)}" aria-label="Doel: ${l}" value="${h(get(`w${n}|t.${r}.doel`)||'')}"><input type="number" min="0" inputmode="numeric" data-k="w${n}|t.${r}.gedaan" id="${sid(`w${n}|t.${r}.gedaan`)}" aria-label="Gedaan: ${l}" value="${h(get(`w${n}|t.${r}.gedaan`)||'')}"></div>`).join('')}</div>
  <div class="cols2">${text(`w${n}|werkte`,'Vrijdag · wat werkte?',3)}${text(`w${n}|niet`,'Vrijdag · wat niet?',3)}</div>${text(`w${n}|win`,'Mijn win van deze week',2)}</div>`}

function evalHtml(n){const e=EVALS[n],k=`ev${e.d}`;
  return `<section class="sec" id="evaluatie"><div class="sechead"><h2>Dag ${e.d} · waar sta je?</h2></div>
  <div class="f" role="radiogroup" aria-label="Hoe dicht ben ik bij mijn doel?"><span class="lb">Hoe dicht ben ik bij mijn doel?</span><div class="scale">${Array.from({length:10},(_,j)=>`<label class="opt"><input type="radio" name="${k}_score" data-k="${k}|score" value="${j+1}" ${String(get(k+'|score'))===String(j+1)?'checked':''}><span>${j+1}</span></label>`).join('')}</div></div>
  <div class="f"><span class="lb">Weken waarin ik het ritme volhield</span><div class="scale">${e.weeks.map(x=>`<label class="opt"><input type="checkbox" data-k="${k}|wk${x}" ${get(`${k}|wk${x}`)?'checked':''}><span>W${x}</span></label>`).join('')}</div></div>
  ${text(k+'|beter','Wat ging beter dan verwacht?')}${text(k+'|vast','Waar liep ik vast?')}${text(k+'|next',e.next)}
  <p class="muted">Bespreek deze pagina met je buddy vóór de live sessie.</p>
  ${n===13?`<div class="card"><div class="mono">Dag 90</div><h2 style="margin:6px 0 10px">Dit heb jij gebouwd.</h2><p style="margin:0">Begin klein. Luister beter. Vraag duidelijker. Doe het opnieuw.</p></div>`:''}</section>`}

function vLocked(n){
  const w=WEEKS[n-1], p=prevWeek(n), pw=WEEKS[p-1];
  if(!started()) return `<article class="sec" style="gap:28px"><header class="wkhead"><div class="kick">Week ${String(n).padStart(2,'0')} / 13</div><h1>${h(w.title)}.</h1></header><div class="card gate">${LOCK}<p style="margin:0"><b>Je run is nog niet gestart.</b> Start je 90 dagen om week 1 te openen.</p><div><button class="btn" type="button" data-start="1">Start mijn 90 dagen</button></div></div></article>`;
  return `<article class="sec" style="gap:28px"><header class="wkhead"><div class="kick">Week ${String(n).padStart(2,'0')} / 13 · ${h(w.ph)}</div><h1>${h(w.title)}.</h1></header>
  <div class="card gate">${LOCK}<p style="margin:0"><b>Deze week is nog dicht.</b> Hij gaat open zodra je week ${p} (${h(pw.title)}) hebt gelezen en de live training hebt gevolgd.</p><div class="cks">${checkRow(`w${p}|read`,'Hoofdstuk gelezen')}${checkRow(`w${p}|trained`,'Live training gevolgd')}</div><div><a class="btn" href="#week-${p}">Naar week ${p}</a></div></div></article>`}
function gateHint(n){
  const nx=nextWeek(n); if(!nx) return '';
  return ready(n)?`<span class="okline">✓ ${nx===8?'De inhaalweek':'Week '+nx} is open.</span> <a href="#week-${nx}">Ga verder →</a>`:`Vink beide af om ${nx===8?'de inhaalweek':'week '+nx} te openen.`}
function sessionBlock(n){
  const ss=SESS.filter(x=>x.week===n); if(!ss.length) return '';
  return ss.map(x=>{const past=new Date(x.starts_at)<new Date(Date.now()-2*36e5);
    return `<div class="card livecard"><div class="mono">${past?'Live training · terugkijken':'Live training'}</div><b>${h(x.title)}</b><span class="muted">${fmtWhen(x.starts_at)}</span><div class="row">${!past&&x.join_url?`<a class="btn" href="${h(x.join_url)}" target="_blank" rel="noopener">Doe mee</a>`:''}${x.recording_url?`<a class="btn ${past?'':'ghost'}" href="${h(x.recording_url)}" target="_blank" rel="noopener">Bekijk de opname</a>`:past?'<span class="muted">Opname volgt</span>':''}</div></div>`}).join('')}
function vWeek(n){
  if(!isOpen(n)) return vLocked(n);
  const w=WEEKS[n-1], m=C&&C[w.mod], full=get('me|mode')!=='light', sc='w'+n;
  const pager=`<div class="pager">${n>1?`<a class="btn ghost" href="#week-${n-1}">← Week ${n-1}</a>`:'<span></span>'}${n<13?`<a class="btn ghost" href="#week-${n+1}">Week ${n+1} →</a>`:`<a class="btn ghost" href="#voortgang">Naar je voortgang →</a>`}</div>`;
  if(n===8){
    return `<article class="sec" style="gap:40px"><header class="wkhead"><div class="row"><span class="pill on">${h(w.ph)}</span><span class="pill">Week 8${weekRange(8)?' · '+weekRange(8):''}</span></div><h1>Inhaalweek. Of rust.</h1><p class="muted" style="font-size:1.1rem">${h(w.sub)}</p></header>
    <section class="sec"><div class="f"><span class="lb">Wat haal ik in?</span><div class="scale">${[1,2,3,4,5,6,7].map(x=>`<label class="opt"><input type="checkbox" data-k="w8|in${x}" ${get('w8|in'+x)?'checked':''}><span>W${x}</span></label>`).join('')}</div></div>${text('w8|a','Wat wil ik inhalen?')}${text('w8|b','Hoe laad ik op?')}${text('w8|c','Mijn intentie voor de tweede helft')}
    <label class="today" style="cursor:pointer"><span class="chk"><input type="checkbox" data-k="w8|done" ${get('w8|done')?'checked':''}><span class="box">✓</span></span><b>Inhaalweek afgerond</b></label></section>${pager}</article>`}
  const fi=FI[n]||[], oef=fi.filter(f=>f.p==='oef'), opdr=fi.filter(f=>f.p==='opdr');
  const slides=CANVA.deck[w.mod];
  let o=`<article class="sec" style="gap:40px">`;
  o+=`<header class="wkhead"><div class="kick">Sales Foundations 90 · Week ${String(n).padStart(2,'0')} / 13 · ${h(w.ph)}</div><h1>${h(w.title)}.</h1><p style="font-size:1.15rem;margin:0">${h(w.sub)}</p><div class="row"><span class="pill">Week ${n}${weekRange(n)?' · '+weekRange(n):''}</span><span class="pill">Training ${String(w.mod).padStart(2,'0')}</span></div></header>`;
  o+=`<section class="sec"><div class="sechead"><h2>De training</h2><span class="mono">Live</span></div>${m?`<p style="font-size:1.12rem"><b>${h(m.thesis)}</b></p>`:''}
   <div class="row"><a class="btn" href="${slides}" target="_blank" rel="noopener">Open de presentatie</a><a class="btn ghost" href="${CANVA.boek}" target="_blank" rel="noopener">Cursusboek · hoofdstuk ${w.mod}</a></div>
   ${m?`<div class="cols2"><div><div class="mono" style="margin-bottom:8px">Na deze training kun je</div><ul class="list">${m.goals.map(g=>`<li>${h(g.replace(/;$|\.$/,''))}</li>`).join('')}</ul></div><div><div class="mono" style="margin-bottom:8px">Kernpunten</div><ul class="list">${m.kern.map(g=>`<li>${h(g)}</li>`).join('')}</ul></div></div>
   ${m.beeld?`<div class="card"><div class="mono">Het beeld van deze week</div><p style="margin:4px 0 0;font-size:1.15rem"><b>${h(sentence(m.beeld))}</b></p></div>`:''}`:''}
   ${sessionBlock(n)}
   <div class="gatebox"><div class="mono">Om verder te gaan</div>
   <label class="today" style="cursor:pointer"><span class="chk"><input type="checkbox" data-k="${sc}|read" ${get(sc+'|read')?'checked':''}><span class="box">✓</span></span><span><b>Hoofdstuk gelezen</b><br><span class="muted">Cursusboek, hoofdstuk ${w.mod}</span></span></label>
   <label class="today" style="cursor:pointer"><span class="chk"><input type="checkbox" data-k="${sc}|trained" ${get(sc+'|trained')?'checked':''}><span class="box">✓</span></span><span><b>Live training gevolgd</b><br><span class="muted">Live of via de opname</span></span></label>
   <p class="muted gatehint" id="gatehint" data-w="${n}" style="margin:0">${gateHint(n)}</p></div></section>`;
  o+=`<section class="sec"><div class="sechead"><h2>Oefening in de ruimte</h2></div>${m?`<p>${h(m.oef)}</p>`:''}${oef.map(f=>fiche(sc,f)).join('')}</section>`;
  o+=`<section class="sec"><div class="sechead"><h2>De weekopdracht</h2>${full?'':'<span class="pill">Light · optioneel</span>'}</div><details ${full?'open':''}><summary>${full?'Weekopdracht en fiche':'Toon de weekopdracht'}</summary><div class="sec" style="margin-top:10px">${m?`<p>${h(m.opdr)}</p>`:''}${opdr.map(f=>fiche(sc,f)).join('')}</div></details></section>`;
  o+=`<section class="sec"><div class="sechead"><h2>De gewoonte</h2><span class="mono" id="wkcount"></span></div><p class="q">${h(w.gew)}</p><div class="track" style="max-width:320px"><i id="wkbar"></i></div>${trackerHtml(n,w)}</section>`;
  o+=`<section class="sec"><div class="sechead"><h2>Zondag · terugblik</h2></div><p class="q">${h(w.tq)}</p>${text(sc+'|tq','Mijn antwoord',2)}${m?m.refl.map((q,i)=>text(`${sc}|r${i}`,q,2)).join(''):''}
   <label class="today" style="cursor:pointer"><span class="chk"><input type="checkbox" data-k="${sc}|done" ${get(sc+'|done')?'checked':''}><span class="box">✓</span></span><span><b>Scorebord ingevuld · week afgerond</b></span></label></section>`;
  if(EVALS[n]) o+=evalHtml(n);
  return o+pager+`</article>`}

function vBonus(){return `<article class="sec" style="gap:40px"><header class="wkhead"><div class="row"><span class="pill on">Business</span><span class="pill">Wanneer nodig</span></div><h1>Het brand partner-gesprek.</h1></header>
  <section class="sec"><div class="row"><a class="btn" href="${CANVA.deck.bonus}" target="_blank" rel="noopener">Open de presentatie</a></div></section>
  <section class="sec"><div class="sechead"><h2>Oefening in de ruimte</h2></div><p>${h(BONUS.oef)}</p>${fiche('bonus',BONUS.fi[0])}</section>
  <section class="sec"><div class="sechead"><h2>Opdracht</h2></div><p>${h(BONUS.opdr)}</p>${fiche('bonus',BONUS.fi[1])}</section></article>`}

function vMijn(){const mode=get('me|mode')||'full';
  return `<div class="sec" style="gap:28px"><div><div class="kick">Sales Foundations 90 · my vision</div><h1>Mijn 90 dagen</h1></div>
  <div class="f"><label class="lb" for="f_me_naam">Dit boek is van</label><input type="text" id="f_me_naam" data-k="me|naam" value="${h(get('me|naam')||'')}" autocomplete="name"></div>
  ${text('me|doel','Mijn doel: wat wil jij anders zien op dag 90?',3)}${text('me|waarom','Waarom dit belangrijk is voor mij',3)}
  <div class="f" role="radiogroup" aria-label="Ik kies"><span class="lb">Ik kies</span><div class="cols2">
   <label class="card" style="cursor:pointer;display:flex;gap:12px"><input type="radio" name="mode" data-k="me|mode" value="light" ${mode==='light'?'checked':''}><span><b>Light</b><br><span class="muted">Sessies, dagelijkse gewoonte, wekelijkse reflectie.</span></span></label>
   <label class="card" style="cursor:pointer;display:flex;gap:12px"><input type="radio" name="mode" data-k="me|mode" value="full" ${mode==='full'?'checked':''}><span><b>Full</b><br><span class="muted">Alles van Light plus de weekopdrachten en het scorebord.</span></span></label></div></div>
  <div class="f"><label class="lb" for="f_me_buddy">Mijn buddy</label><input type="text" id="f_me_buddy" data-k="me|buddy" value="${h(get('me|buddy')||'')}"></div>
  <div class="cols2"><div class="f"><label class="lb" for="f_me_sign">Handtekening</label><input type="text" id="f_me_sign" data-k="me|sign" value="${h(get('me|sign')||'')}" placeholder="Typ je naam"></div><div class="f"><label class="lb" for="f_me_dat">Datum</label><input type="date" id="f_me_dat" data-k="me|dat" value="${h(get('me|dat')||'')}"></div></div></div>`}

function chart(){
  const bw=34,gap=14,x0=34,H=150,top=16;let svg='';
  svg+=`<line class="axis" x1="${x0-6}" y1="${top+H}" x2="${x0+13*(bw+gap)}" y2="${top+H}"/><line class="axis" x1="${x0-6}" y1="${top}" x2="${x0+13*(bw+gap)}" y2="${top}"/><text class="ct" x="${x0-10}" y="${top+4}" text-anchor="end">7</text><text class="ct" x="${x0-10}" y="${top+H+4}" text-anchor="end">0</text>`;
  WEEKS.forEach((w,i)=>{const x=x0+i*(bw+gap)+gap/2;
    if(w.n===8){svg+=`<rect class="barbg" x="${x}" y="${top}" width="${bw}" height="${H}"/><text class="ct" x="${x+bw/2}" y="${top+H/2}" text-anchor="middle">rust</text>`}
    else{const c=wd(w.n),bh=c/7*H;svg+=`<rect class="barbg" x="${x}" y="${top}" width="${bw}" height="${H}"/><rect class="bar1" x="${x}" y="${top+H-bh}" width="${bw}" height="${bh}"/>${c?`<text class="ct" x="${x+bw/2}" y="${top+H-bh-4}" text-anchor="middle">${c}</text>`:''}`}
    svg+=`<text class="ct" x="${x+bw/2}" y="${top+H+16}" text-anchor="middle">W${w.n}</text>`});
  return `<div class="chartwrap"><svg class="chart" viewBox="0 0 ${x0+13*(bw+gap)+10} ${top+H+26}" role="img" aria-label="Aantal afgevinkte dagen per week, maximaal zeven">${svg}</svg></div>`}
function vVoortgang(){
  const ev=[30,60,90].map(d=>({d,s:get(`ev${d}|score`)}));
  return `<div class="sec" style="gap:32px"><div><div class="kick">Scorebord</div><h1>Voortgang</h1></div>
  <div class="stats">${statsHtml()}<div><span class="mono">Totaal</span><b>${pct()}%</b></div></div>
  <section class="sec"><div class="sechead"><h2>Dagen per week</h2><span class="muted">Afgevinkte gewoonte-dagen, maximaal 7.</span></div>${chart()}</section>
  <section class="sec"><div class="sechead"><h2>Wat ik telde</h2><span class="muted">We tellen wat je doet, niet wat je verkoopt.</span></div><div class="sums">${[['gesprekken','Gesprekken'],['opvolgingen','Opvolgingen'],['posts','Stories of posts'],['sessie','Sessies']].map(([r,l])=>`<div><span class="mono">${l}</span><span class="big">${sumRow(r,'gedaan')}<span class="muted" style="font-size:1rem"> / ${sumRow(r,'doel')||'–'}</span></span></div>`).join('')}</div></section>
  <section class="sec"><div class="sechead"><h2>Meetmomenten</h2></div><div class="sums">${ev.map(e=>`<a href="#week-${e.d===30?4:e.d===60?10:13}-evaluatie" style="text-decoration:none"><div><span class="mono">Dag ${e.d}</span><span class="big">${e.s||'–'}<span class="muted" style="font-size:1rem"> / 10</span></span></div></a>`).join('')}</div></section>
  <section class="sec"><div class="sechead"><h2>Back-up</h2></div><p class="muted">Je voortgang wordt bewaard in deze browser, op dit toestel. Wil je hem meenemen naar een ander toestel, maak dan een back-up en herstel hem daar.</p>
   <div class="row"><button class="btn" id="bk">Back-up opslaan</button><label class="btn ghost" for="rs" style="cursor:pointer">Back-up herstellen</label><input type="file" id="rs" accept=".json,application/json" hidden></div>
   <div id="bkout"></div></section></div>`}

function vMateriaal(){
  return `<div class="sec" style="gap:32px"><div><div class="kick">Alles bij elkaar</div><h1>Materiaal</h1></div>
  <section class="sec"><div class="sechead"><h2>Boeken</h2></div><div class="mat"><a href="${CANVA.boek}" target="_blank" rel="noopener">Cursusboek · de theorie</a><a href="${CANVA.werkboek}" target="_blank" rel="noopener">Werkboek · papieren versie</a></div></section>
  <section class="sec"><div class="sechead"><h2>Presentaties</h2></div><div class="mat">${WEEKS.filter(w=>w.mod).map(w=>isOpen(w.n)?`<a href="${CANVA.deck[w.mod]}" target="_blank" rel="noopener">${String(w.mod).padStart(2,'0')} · ${h(w.title)}</a>`:`<span class="lockedmat">${String(w.mod).padStart(2,'0')} · ${h(w.title)}${LOCK}</span>`).join('')}<a href="${CANVA.deck.bonus}" target="_blank" rel="noopener">Bonus · het brand partner-gesprek</a></div></section>
  <section class="sec"><div class="sechead"><h2>Het ritme</h2></div><div class="rules">${[['Maandag','Weekfocus in de groep. Lees je opdracht.'],['Woensdag','Check-in: waar loop je vast?'],['Vrijdag','Deel je wins. Ook kleine.'],['Zondag','Vul je scorebord in.']].map(([d,t])=>`<div><b>${d}</b> · ${t}</div>`).join('')}</div>
   <p class="muted">Elke week heeft drie onderdelen: de training, de weekopdracht en de gewoonte, één kleine actie per dag.</p></section>
  <section class="sec"><div class="sechead"><h2>Drie spelregels</h2></div><div class="rules">
   <div><b>Geen gezondheidsclaims.</b> Essentiële oliën genezen, behandelen of voorkomen geen ziekten en vervangen geen medische zorg. Spreek vanuit eigen ervaring en de officiële productinformatie, en verwijs bij medische vragen naar een arts.</div>
   <div><b>Geen inkomensclaims.</b> Niet in de groep, niet in je posts, niet in je gesprekken. Geen bedragen, geen beloftes over verdiensten.</div>
   <div><b>Wie een week mist, valt niet uit.</b> Je pakt het gewoon terug op. Daarvoor bestaat de inhaalweek.</div></div></section></div>`}

/* ---- router ---- */
const NAV=[['start','Vandaag'],['reis','Reis'],['mijn-90','Mijn 90'],['voortgang','Voortgang'],['materiaal','Materiaal']];
function route(){
  const raw=(location.hash||'#start').slice(1);
  let r=raw,anchor='';
  const m=raw.match(/^week-(\d+)(-evaluatie)?$/);
  let v;
  if(m&&+m[1]>=1&&+m[1]<=13){r='week-'+m[1];v=vWeek(+m[1]);anchor=m[2]?'evaluatie':''}
  else if(r==='bonus') v=vBonus();
  else if(r==='reis') v=vReis();
  else if(r==='mijn-90') v=vMijn();
  else if(r==='voortgang') v=vVoortgang();
  else if(r==='materiaal') v=vMateriaal();
  else {r='start';v=vStart()}
  document.getElementById('app').innerHTML=v;
  const sect=r.startsWith('week')||r==='bonus'?'reis':r;
  document.getElementById('nav').innerHTML=NAV.map(([id,l])=>`<a href="#${id}" ${id===sect?'aria-current="page"':''}>${l}</a>`).join('');
  paint();
  if(anchor){const e=document.getElementById(anchor); if(e) e.scrollIntoView(); else window.scrollTo(0,0)} else window.scrollTo(0,0);
  bindBackup();
}
function paint(){
  const p=pct(), c=current();
  document.getElementById('hpl').textContent=(c.state==='run'?'Dag '+Math.min(90,c.i+1)+' · ':'')+p+'%';
  document.getElementById('hpb').style.width=p+'%';
  const st=document.getElementById('stats'); if(st) st.innerHTML=statsHtml();
  const m=(location.hash||'').match(/^#week-(\d+)/);
  if(m){const n=+m[1],d=wd(n),b=document.getElementById('wkbar'),t=document.getElementById('wkcount'); if(b) b.style.width=d/7*100+'%'; if(t) t.textContent=d+' van 7 dagen'}
}
addEventListener('hashchange',route);

/* ---- invoer ---- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-day]'); if(!b) return;
  const k=b.dataset.day, on=!get(k); put(k,on);
  b.setAttribute('aria-pressed',on?'true':'false');
  const l=document.getElementById('todaylab'); if(l&&b.id==='todaybtn') l.textContent=on?'Vandaag gedaan':'Vandaag afvinken';
  paint();
  if(b.id==='todaybtn'){const r=document.querySelector('.ringsvg'); if(r){const t=document.createElement('div'); t.innerHTML=ring(); r.replaceWith(t.firstChild)}}
});
function onField(e){
  const el=e.target; if(!el.dataset||!el.dataset.k) return;
  if(el.type==='checkbox') put(el.dataset.k,el.checked);
  else if(el.type==='radio'){ if(el.checked) put(el.dataset.k,el.value) }
  else put(el.dataset.k,el.value.trim()===''?'':el.value);
  paint();
}
document.addEventListener('input',onField);
document.addEventListener('change',onField);

/* ---- back-up ---- */
function bindBackup(){
  const bk=document.getElementById('bk'), rs=document.getElementById('rs'), out=document.getElementById('bkout');
  if(!bk) return;
  bk.onclick=async()=>{
    const data=JSON.stringify(S,null,1);
    try{const dl=window.claude&&await window.claude.use('downloads'); if(dl){await dl.save({filename:'90-day-run-voortgang.json',data}); return}}catch(e){ if(e&&e.code==='declined') return }
    out.innerHTML=`<div class="f"><label class="lb" for="bktxt">Kopieer deze tekst en bewaar hem ergens veilig</label><textarea id="bktxt" rows="6" readonly>${h(data)}</textarea></div>`;
    const t=document.getElementById('bktxt'); t.focus(); t.select();
  };
  rs.onchange=()=>{const f=rs.files&&rs.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result); if(!o||typeof o.d!=='object') throw 0; S=o; persist(); out.innerHTML='<p class="muted">Back-up hersteld.</p>'; paint(); setTimeout(route,600)}catch(e){out.innerHTML='<p>Dat bestand is geen geldige back-up.</p>'}};
    r.readAsText(f)};
}
route();
</script>
